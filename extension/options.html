<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, sans-serif; padding: 12px; min-width: 360px; }
      label { display: block; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 5px; }
      button { margin-top: 12px; padding: 6px 14px; }
      #saved { color: #2e7d32; margin-left: 8px; visibility: hidden; }
    </style>
  </head>
  <body>
    <label for="base">Daemon URL</label>
    <input id="base" placeholder="http://127.0.0.1:8765" />
    <label for="token">Token (blank if the daemon runs without --token)</label>
    <input id="token" type="password" />
    <button id="save">Save</button><span id="saved">saved</span>
    <script src="options.js"></script>
  </body>
</html>
