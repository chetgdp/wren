[project]
name = "wren"
version = "0.1.0"
description = "Voice cloning (tts/) on qwentts.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "soundfile>=0.14.0",
    "pedalboard>=0.9.24",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
trs = [
    "mlx-whisper>=0.4.3",
    "yt-dlp>=2026.8.19",
]

[tool.pytest.ini_options]
testpaths = ["tts"]

[tool.ruff]
line-length = 80

[tool.uv]
package = false
default-groups = ["dev", "trs"]
